name: Frontend Deployment
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Vercel Project Settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Inyectar variables de entorno propias
        run: |
          ENV_FILE=".vercel/.env.production.local"

          inject_var() {
            local key=$1
            local value=$2
            if grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
            else
              echo "${key}=${value}" >> "$ENV_FILE"
            fi
          }

          inject_var "VITE_API_BASE_URL"          "$VITE_API_BASE_URL"
          inject_var "VITE_GOOGLE_CLIENT_ID"      "$VITE_GOOGLE_CLIENT_ID"
          inject_var "VITE_UNSPLASH_ACCESS_KEY"   "$VITE_UNSPLASH_ACCESS_KEY"
          inject_var "VITE_GITHUB_CLIENT_ID"      "$VITE_GITHUB_CLIENT_ID"

          echo "Variables inyectadas correctamente"
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.VITE_UNSPLASH_ACCESS_KEY }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}

      - name: Validar variables requeridas
        run: |
          ENV_FILE=".vercel/.env.production.local"

          validate_var() {
            local key=$1
            local value
            value=$(grep "^${key}=" "$ENV_FILE" | cut -d '=' -f2-)
            if [[ -z "$value" ]]; then
              echo "ERROR: ${key} está vacía"
              exit 1
            fi
            if [[ "$value" == *"localhost"* || "$value" == *"127.0.0.1"* ]]; then
              echo "ERROR: ${key} apunta a localhost: $value"
              exit 1
            fi
            echo "${key} validada correctamente"
          }

          validate_var "VITE_API_BASE_URL"
          validate_var "VITE_GOOGLE_CLIENT_ID"
          validate_var "VITE_UNSPLASH_ACCESS_KEY"
          validate_var "VITE_GITHUB_CLIENT_ID"

      - name: Preparar variable API para Cypress
        run: |
          ENV_FILE=".vercel/.env.production.local"
          API_URL=$(grep '^VITE_API_BASE_URL=' "$ENV_FILE" | cut -d '=' -f2-)
          if [[ -z "$API_URL" ]]; then
            echo "ERROR: no se pudo obtener VITE_API_BASE_URL para Cypress"
            exit 1
          fi
          echo "CYPRESS_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Ejecutar tests E2E
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: pnpm dev --host 0.0.0.0 --port 5173
          wait-on: 'http://127.0.0.1:5173'
          wait-on-timeout: 120
        env:
          CYPRESS_API_BASE_URL: ${{ env.CYPRESS_API_BASE_URL }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}