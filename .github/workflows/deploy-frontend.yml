name: Frontend Deployment
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm' # Guarda en caché las dependencias para ir más rápido

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Vercel CLI
        run: pnpm add -g vercel

      # 1. Descarga las variables de entorno de producción desde Vercel
      # (Crea un archivo temporal cifrado en la máquina de GitHub)
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Validar variables requeridas de Vercel
        run: |
          ENV_FILE=".vercel/.env.production.local"

          if [[ ! -f "$ENV_FILE" ]]; then
            echo "No existe $ENV_FILE tras vercel pull"
            exit 1
          fi

          if ! grep -q '^VITE_API_BASE_URL=' "$ENV_FILE"; then
            echo "Falta VITE_API_BASE_URL en entorno de Vercel (production)"
            exit 1
          fi

          API_BASE_URL=$(grep '^VITE_API_BASE_URL=' "$ENV_FILE" | cut -d '=' -f2-)

          if [[ -z "$API_BASE_URL" ]]; then
            echo "VITE_API_BASE_URL esta vacia"
            exit 1
          fi

          if [[ "$API_BASE_URL" == *"localhost"* || "$API_BASE_URL" == *"127.0.0.1"* ]]; then
            echo "VITE_API_BASE_URL apunta a localhost en production: $API_BASE_URL"
            exit 1
          fi

          echo "VITE_API_BASE_URL validada correctamente"
          
          # Inyectar las variables directamente en GITHUB_ENV para que el siguiente paso las herede en el sistema
          while IFS='=' read -r key value; do
            if [[ -n "$key" && "$key" != \#* ]]; then
              # Limpiar comillas al principio y al final
              clean_value="${value%\"}"
              clean_value="${clean_value#\"}"
              echo "$key=$clean_value" >> $GITHUB_ENV
            fi
          done < "$ENV_FILE"

      # 2. Compila el proyecto inyectando de forma segura las variables descargadas
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # 3. Sube los archivos ya compilados (prebuilt) listos para producción
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}